# Edit the API contract here. Update procedure and provenance: docs/adr/0004-github-openapi.md
openapi: 3.0.3
info:
  title: GitHub sample API
  version: 2026-03-10
paths:
  "/repos/{owner}/{repo}":
    get:
      operationId: repos/get
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
  "/repos/{owner}/{repo}/issues":
    get:
      operationId: issues/list-for-repo
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - closed
              - all
            default: open
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 30
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
  "/repos/{owner}/{repo}/issues/{issue_number}":
    get:
      operationId: issues/get
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /search/repositories:
    get:
      operationId: search/repos
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - stars
              - forks
              - help-wanted-issues
              - updated
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 30
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
components:
  schemas:
    Issue:
      type: object
      required:
        - id
        - number
        - title
        - state
        - user
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
        title:
          type: string
        state:
          type: string
        body:
          type: string
          nullable: true
        user:
          $ref: "#/components/schemas/Owner"
          nullable: true
        updated_at:
          type: string
          format: date-time
        pull_request:
          $ref: "#/components/schemas/PullRequest"
    Owner:
      type: object
      required:
        - login
        - avatar_url
      properties:
        login:
          type: string
        avatar_url:
          type: string
          format: uri
    PullRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    RepoSummary:
      type: object
      required:
        - id
        - name
        - full_name
        - description
        - owner
        - language
        - stargazers_count
        - forks_count
        - html_url
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        full_name:
          type: string
        description:
          type: string
          nullable: true
        owner:
          $ref: "#/components/schemas/Owner"
          nullable: true
        language:
          type: string
          nullable: true
        stargazers_count:
          type: integer
        forks_count:
          type: integer
        topics:
          type: array
          items:
            type: string
        html_url:
          type: string
          format: uri
    Repository:
      type: object
      required:
        - id
        - name
        - full_name
        - description
        - owner
        - language
        - stargazers_count
        - forks_count
        - html_url
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        full_name:
          type: string
        description:
          type: string
          nullable: true
        owner:
          $ref: "#/components/schemas/Owner"
        language:
          type: string
          nullable: true
        stargazers_count:
          type: integer
        forks_count:
          type: integer
        topics:
          type: array
          items:
            type: string
        html_url:
          type: string
          format: uri
    SearchResult:
      type: object
      required:
        - total_count
        - incomplete_results
        - items
      properties:
        total_count:
          type: integer
        incomplete_results:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepoSummary"
