# Third-party libraries by role. CI checks these against each platform's dependencies.
# ios.name is the lowercase package ID in .product(..., package: ...); android.name is the library alias in libs.versions.toml.
# AndroidX, Kotlin, and kotlinx are official infrastructure and do not require mappings or wrappers.
libraries: []
# Example:
# - role: analytics
#   module: core/analytics
#   ios: { name: firebase-ios-sdk, license: Apache-2.0 }
#   android: { name: firebase-bom, license: Apache-2.0 }
#   owner: platform-team
