# Navigator state transitions (Operations in modules/core/navigation/spec.md).
# Tests on both platforms implement the same steps and compare NavigationState. given.navigation is the initial state (empty means default).
# Annotate each test with `@scenario navigation/<id>`.
name: navigation
feature: core/navigation
steps:
  - id: push-onto-selected-tab
    name: Push onto the selected tab stack when no modal is open
    given:
      navigation: {}
    when: push repositoryDetail(owner owner, repo 1)
    then:
      stacks: { home: [repositoryDetail(owner owner, repo 1)] }
      modals: []
  - id: push-inside-modal
    name: Push onto the top modal stack while a modal is open
    given:
      navigation:
        modals: [{ style: sheet, stack: [repositorySearch] }]
    when: push repositoryDetail(owner owner, repo 1)
    then:
      stacks: { home: [] }
      modals: [{ style: sheet, stack: [repositorySearch, repositoryDetail(owner owner, repo 1)] }]
  - id: pop-modal-root-dismisses
    name: Pop at the modal root closes the modal
    given:
      navigation:
        modals: [{ style: sheet, stack: [repositorySearch] }]
    when: pop
    then:
      modals: []
  - id: pop-on-empty-stack
    name: Pop on an empty tab stack leaves state unchanged
    given:
      navigation: {}
    when: pop
    then:
      stacks: { home: [] }
  - id: pop-to-root
    name: popToRoot clears the tab stack
    given:
      navigation:
        stacks: { home: [repositoryDetail(owner owner, repo 1), repositoryDetail(owner owner, repo 2)] }
    when: popToRoot
    then:
      stacks: { home: [] }
  - id: present-and-dismiss
    name: present stacks modals and dismiss closes the top one
    given:
      navigation: {}
    when: present repositoryDetail(owner owner, repo 1) fullScreen, present repositorySearch sheet, dismiss
    then:
      modals: [{ style: fullScreen, stack: [repositoryDetail(owner owner, repo 1)] }]
  - id: select-tab-dismisses-modals
    name: Selecting a tab closes all modals and preserves stacks
    given:
      navigation:
        stacks: { home: [repositoryDetail(owner owner, repo 1)] }
        modals: [{ style: sheet, stack: [repositorySearch] }]
    when: selectTab home
    then:
      selectedTab: home
      stacks: { home: [repositoryDetail(owner owner, repo 1)] }
      modals: []
  - id: open-deep-link
    name: Create navigation state from a deep-link path
    given:
      navigation: {}
    when: opening(Route(path)) in home
    then:
      "/repositories/owner/a%2F1": { stacks: { home: [repositoryDetail(owner owner, repo a/1)] } }
      "/search": { stacks: { home: [] } }
      "/unknown": no route
  - id: open-url-with-encoded-id
    name: Decode each URL path segment exactly once
    given:
      navigation: {}
    when: open URL then create NavigationState
    then:
      "https://example.com/repositories/owner/a%2F1?source=test#detail": { id: "a/1" }
      "https://example.com/repositories/owner/a%252F1?source=test#detail": { id: "a%2F1" }
      "https://example.com/repositories/owner/a%2B1?source=test#detail": { id: "a+1" }
  - id: duplicate-route-entries
    name: Repeated openings of the same screen use distinct entry IDs
    given:
      navigation: {}
    when: push same route twice, pop, push again; present and push same route, popToRoot
    then:
      entryIds: unique-per-opening
      remainingEntryIds: unchanged
