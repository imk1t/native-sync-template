# 両 OS のテストに同名の @scenario マーカーを記載する。
{name: github-network,feature: core/network,steps: [{id: nullable,name: 64bit IDとnullを受理し必須キーの欠落は拒否する,given: &given {search/repos: {status: 200,body: {total_count: 1,incomplete_results: false,items: [{id: 5000000001,name: Hello-World,full_name: octocat/Hello-World,description: GitHub API を使うネイティブアプリのサンプル。,owner: {login: octocat,avatar_url: ""},language: Swift,stargazers_count: 120,forks_count: 20,topics: [swift,android,sample],html_url: https://github.com/octocat/Hello-World}]}}},when: nullと未知フィールドを含むレスポンスをデコードする,then: {id: 5000000001,missingRequired: error}},{id: pull-requests,name: PRのみのページでもLinkの次ページを残す,given: {issues/list-for-repo: {status: 200,headers: {Link: "<https://api.github.com/repos/octocat/Hello-World/issues?page=2>; rel=\"next\""},body: []}},when: PRを除外しnull投稿者と省略本文を読む,then: {count: 0,nextPage: 2,author: null,body: null}},{id: search-limit,name: 1000件上限と不完全な結果を示す,given: *given,when: 上限を超えた検索の50ページ目を受信する,then: {nextPage: null,limitReached: true,incomplete: true}},{id: rate-limit,name: 403と429の待機時間まで再送を抑制する,given: {search/repos: {status: 429,headers: {Retry-After: "120"},body: {message: rate limit}}},when: 2回送信し待機時間後に再試行する,then: {requestsBeforeDeadline: 1,requestsAfterDeadline: 2}},{id: ordinary-forbidden,name: 通常の403をレート制限と区別する,given: {repos/get: {status: 403,body: {message: Forbidden}}},when: 通常の403後に再試行する,then: {error: forbidden,requests: 2}}]}
