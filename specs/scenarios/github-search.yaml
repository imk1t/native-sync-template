name: github-search
feature: features/search
steps:
  - id: load-succeeds
    name: Show submitted search results without fetching twice on redisplay
    given: &a1
      search/repos:
        status: 200
        body:
          total_count: 1
          incomplete_results: false
          items:
            - id: 5000000001
              name: Hello-World
              full_name: octocat/Hello-World
              description: GitHub API を使うネイティブアプリのサンプル。
              owner:
                login: octocat
                avatar_url: ""
              language: Swift
              stargazers_count: 120
              forks_count: 20
              topics:
                - swift
                - android
                - sample
              html_url: https://github.com/octocat/Hello-World
    when: Submit swift and redisplay the screen
    then:
      count: 1
      requests: 1
  - id: blank
    name: Do not submit whitespace-only input
    given:
      localState:
        values: {}
    when: Submit whitespace-only input
    then:
      requests: 0
  - id: change-conditions
    name: Apply language and sort order and reset results
    given: *a1
    when: Search Swift sorted by stars then change to Kotlin
    then:
      query: kotlin is:public language:Kotlin
      page: 1
  - id: load-fails
    name: Display failures and allow manual retry
    given:
      search/repos:
        status: 500
        body:
          message: failed
    when: Retry after a fetch failure and return 200
    then:
      count: 1
      error: null
  - id: empty
    name: Show zero results as a loaded empty state
    given:
      search/repos:
        status: 200
        body:
          total_count: 0
          incomplete_results: false
          items: []
    when: Submit a search
    then:
      hasLoaded: true
      count: 0
  - id: pagination
    name: Preserve items after pagination failure and handle duplicate IDs and the final page
    given: *a1
    when: Fetch one item, fail page two, then retry with two items including a duplicate
    then:
      ids:
        - 1
        - 2
      nextPage: null
      incomplete: Display the API value
      limitReached: Display the API value
  - id: stale-response
    name: Ignore delayed results from previous search conditions
    given: &a2
      search/repos:
        pending: true
    when: Change conditions while a request is pending and fetch new results
    then:
      ids:
        - 2
      error: null
  - id: cancellation
    name: Do not treat screen request cancellation as an error
    given: *a2
    when: Cancel the request and redisplay the screen
    then:
      isLoading: false
      error: null
      reload: true
  - id: cache
    name: Cache matching requests for five minutes and bypass the cache on explicit refresh
    given: *a1
    when: Fetch twice with matching conditions, refresh, wait 301 seconds, then fetch with a different sort order
    then:
      requests: 4
  - id: localized-failure
    name: Network errors retain unresolved message keys and status codes
    given:
      search/repos:
        status: 500
        body:
          message: failed
    when: Fail the search request
    then:
      errorKey: error_server
      arguments:
        status: 500
