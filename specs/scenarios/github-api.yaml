# Use matching @scenario markers in both platforms' tests.
{name: github-api,feature: shared/github,steps: [{id: nullable,name: Accept 64-bit IDs and null values and reject missing required keys,given: &given {search/repos: {status: 200,body: {total_count: 1,incomplete_results: false,items: [{id: 5000000001,name: Hello-World,full_name: octocat/Hello-World,description: GitHub API を使うネイティブアプリのサンプル。,owner: {login: octocat,avatar_url: ""},language: Swift,stargazers_count: 120,forks_count: 20,topics: [swift,android,sample],html_url: https://github.com/octocat/Hello-World}]}}},when: Decode a response containing null values and unknown fields,then: {id: 5000000001,missingRequired: error}},{id: pull-requests,name: Preserve Link pagination even for PR-only pages,given: {issues/list-for-repo: {status: 200,headers: {Link: "<https://api.github.com/repos/octocat/Hello-World/issues?page=2>; rel=\"next\""},body: []}},when: Filter pull requests and read null authors and omitted bodies,then: {count: 0,nextPage: 2,author: null,body: null}},{id: search-limit,name: Expose the 1000-result limit and incomplete results,given: *given,when: Receive page 50 of a search exceeding the result limit,then: {nextPage: null,limitReached: true,incomplete: true}},{id: rate-limit,name: Suppress requests until the retry time for 403 and 429 rate limits,given: {search/repos: {status: 429,headers: {Retry-After: "120"},body: {message: rate limit}}},when: Send twice and retry after the waiting period,then: {requestsBeforeDeadline: 1,requestsAfterDeadline: 2}},{id: ordinary-forbidden,name: Distinguish ordinary 403 responses from rate limits,given: {repos/get: {status: 403,body: {message: Forbidden}}},when: Retry after an ordinary 403,then: {error: forbidden,requests: 2}}]}
