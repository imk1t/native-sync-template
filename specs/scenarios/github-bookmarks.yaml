{name: github-bookmarks,feature: shared/bookmarks,steps: [{id: save-restore,name: Restore bookmarks and notes and allow removal,given: &given {localState: {values: {}}},when: Add a bookmark then save a note then recreate the store and remove the bookmark,then: {restoredNote: メモ,finalCount: 0}},{id: limits,name: Enforce limits of 100 bookmarks and 1000 code points,given: *given,when: Attempt to save a 101st bookmark and a 1001-character note,then: {count: 100,rejectOverflow: true}},{id: write-fails,name: Preserve public state on write failure,given: {localState: {writeFails: true}},when: Remove a saved item,then: {retainsBookmark: true}},{id: unknown-version,name: Do not overwrite invalid stored values with empty data,given: {localState: {values: {github.bookmarks.v1: "{\"version\":2,\"items\":[]}"}}},when: Attempt to add a bookmark,then: {error: true,storageUnchanged: true}},{id: concurrent-writes,name: Preserve concurrent updates,given: *given,when: Save two different bookmarks concurrently,then: {ids: [1,2]}}]}
