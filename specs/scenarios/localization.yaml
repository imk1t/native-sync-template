name: localization
feature: core/localization
steps:
  - id: language-change
    name: 同じ文言を表示時の言語で解決し未対応言語は日本語に戻す
    given:
      localization: {locale: ja}
    when: 再試行メッセージを日本語・英語・未対応のフランス語で解決する
    then:
      ja: 再試行
      en: Retry
      fr: 再試行
  - id: plural-arguments
    name: 数量と引数をネイティブリソースで解決する
    given:
      localization: {locale: en}
    when: Star 数 0・1・2、日本語の2、検索条件とHTTP503を表示する
    then:
      singular: 1 star
      plural: 2 stars
      zero: 0 stars
      japanese: Star 2
      filter: "Language: Swift"
      status: 503
