name: localization
feature: core/localization
steps:
  - id: language-change
    name: Resolve messages in the display language and fall back to Japanese for unsupported languages
    given:
      localization: {locale: ja}
    when: Resolve the retry message in Japanese, English, and unsupported French
    then:
      ja: 再試行
      en: Retry
      fr: 再試行
  - id: plural-arguments
    name: Resolve quantities and arguments through native resources
    given:
      localization: {locale: en}
    when: Display 0, 1, and 2 stars in English; 2 in Japanese; search conditions; and HTTP 503
    then:
      singular: 1 star
      plural: 2 stars
      zero: 0 stars
      japanese: Star 2
      filter: "Language: Swift"
      status: 503
