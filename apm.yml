name: native-sync-template
version: 0.1.0
description: iOS / Android ネイティブ同時開発テンプレートのエージェント設定
# Claude Code は .claude/skills/、Codex などは .agents/skills/ に配置される
targets:
  - claude
  - codex

dependencies:
  apm:
    # 共通の Skill・MCP
    - imk1t/apm-shared#v0.1.4
    # Android（Google 公式 android/skills）。タグがないためコミットで固定する
    - android/skills/jetpack-compose/adaptive#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/jetpack-compose/jetpack-compose-performance#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/navigation/navigation-3#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/navigation/navigation-event#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/testing/testing-setup#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/performance/anr-audit-and-fix#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/performance/r8-analyzer#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/security/android-intent-security#6daa53ef27fa2aa87827d183a85c06cedceca833
    - android/skills/security/android-permissions-security#6daa53ef27fa2aa87827d183a85c06cedceca833
    # iOS（Paul Hudson の Agent Skill、MIT）。同じくコミットで固定する。
    # swift-concurrency-pro と swift-testing-pro は apm が取り込めないため .apm/skills/ に写してある
    - twostraws/SwiftUI-Agent-Skill/swiftui-pro#f2920b63995263f57b3e198674e89a602efba6d2
  mcp: []
includes: auto
scripts: {}
