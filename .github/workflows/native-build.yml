# iOS / Android のビルドとテスト。時間とコストがかかるため、自動では実行せず手動で起動する
# （Actions タブの「Run workflow」）。必要になったら on に pull_request を足す。
name: Native build
on: workflow_dispatch

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test modules
        working-directory: modules
        run: xcodebuild test -scheme Modules-Package -destination 'platform=iOS Simulator,name=iPhone 16'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test modules
        working-directory: apps/android
        run: gradle test assembleDebug
