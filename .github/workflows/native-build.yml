# iOS / Android のビルドとテスト。時間とコストがかかるため、自動では実行せず手動で起動する
# （Actions タブの「Run workflow」）。必要になったら on に pull_request を足す。
name: Native build
on: workflow_dispatch

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # ランナーのイメージによって入っている Simulator が変わるため、機種名を固定せず
      # 利用できる iPhone を選ぶ（無ければ iOS ランタイムを入れて作る）。
      - name: Pick iOS Simulator
        id: sim
        run: |
          first_iphone() {
            xcrun simctl list devices available -j | python3 -c 'import json,sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True):
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()'
          }
          udid="$(first_iphone)"
          if [ -z "$udid" ]; then
            runtime="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys
          ios=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS"]
          print(ios[-1]["identifier"] if ios else "")')"
            if [ -z "$runtime" ]; then
              xcodebuild -downloadPlatform iOS
              runtime="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys
          print([r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS"][-1]["identifier"])')"
            fi
            devicetype="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys
          print([d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPhone")][-1])')"
            udid="$(xcrun simctl create CI-iPhone "$devicetype" "$runtime")"
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test modules
        working-directory: modules
        run: xcodebuild test -scheme Modules-Package -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

  # アプリ本体（apps/ios）のビルド。XcodeGen でプロジェクトを作り、Simulator 向けに署名なしでビルドする。
  ios-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build app
        working-directory: apps/ios
        run: >-
          xcodebuild build -project App.xcodeproj -scheme App
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test modules
        working-directory: apps/android
        run: gradle test assembleDebug
