# iOS / Android のビルドとテスト。時間とコストがかかるため、自動では実行せず手動で起動する
# （Actions タブの「Run workflow」）。必要になったら on に pull_request を足す。
name: Native build
on: workflow_dispatch

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      # ランナーのイメージによって入っている Simulator が変わるため、機種名を固定せず
      # 利用できる iPhone を選ぶ（無ければ iOS ランタイムを入れて作る）。
      - name: Pick iOS Simulator
        id: sim
        # JSON はランナーに入っている jq で読む。
        run: |
          first_iphone() {
            xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse[]
              | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | .udid] | first // empty'
          }
          last_ios_runtime() {
            xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS") | .identifier] | last // empty'
          }
          udid="$(first_iphone)"
          if [ -z "$udid" ]; then
            runtime="$(last_ios_runtime)"
            if [ -z "$runtime" ]; then
              xcodebuild -downloadPlatform iOS
              runtime="$(last_ios_runtime)"
            fi
            devicetype="$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone")) | .identifier] | last')"
            udid="$(xcrun simctl create CI-iPhone "$devicetype" "$runtime")"
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Test modules
        working-directory: modules
        run: xcodebuild test -scheme Modules-Package -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

  # アプリ本体（apps/ios）のビルド。XcodeGen でプロジェクトを作り、Simulator 向けに署名なしでビルドする。
  ios-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build app
        working-directory: apps/ios
        run: >-
          xcodebuild build -project App.xcodeproj -scheme App
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4.4.3
      - name: Test modules
        working-directory: apps/android
        run: ./gradlew test assembleDebug
