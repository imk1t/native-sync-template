# 最小限の CI。数秒で終わる検査だけを PR ごとに実行する。
# ツールのバージョンは mise.toml で管理し、jdx/mise-action で同じものを入れる。
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: jdx/mise-action@v2.4.4
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      # 依存（型検査用のみ）に既知の脆弱性がないか
      - run: bun audit
      # 整形・型検査・tools のテスト・spec の同期・依存ルール・生成差分・共通シナリオ
      - run: mise run check

  # Swift は SwiftLint、Kotlin は ktlint。設定は .swiftlint.yml と .editorconfig。
  # どちらも Linux で動かせるため、macOS ランナーは使わない。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: SwiftLint
        # mise.toml の swiftlint と同じバージョンにそろえる。
        run: |
          docker run --rm -v "$PWD":/work -w /work ghcr.io/realm/swiftlint:0.65.1 lint --strict
      - uses: jdx/mise-action@v2.4.4
        with:
          install_args: ktlint
      - name: ktlint
        run: ktlint "**/*.kt" "**/*.kts" "!**/generated/**"

  # uses: のアクションが .github/workflows/actions.lock に記録したコミットと一致するか。
  # uses: を変えたら手元で `gh actions-lock` を実行して lockfile を更新する。
  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        # 拡張はまだ 0.x のため、バージョンを固定する（手元で使うものとそろえる）。
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
