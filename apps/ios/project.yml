# XcodeGen の定義。`xcodegen generate` で App.xcodeproj を作る（.xcodeproj はコミットしない）。
name: App
include: [Generated/Localization/config.yml]
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  Modules:
    path: ../../modules
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: Modules
        product: CoreLocalization
      - package: Modules
        product: FeatureSearch
      - package: Modules
        product: FeatureBookmarks
      - package: Modules
        product: SharedBookmarks
      - package: Modules
        product: DesignSystem
      - package: Modules
        product: FeatureSettings
      - package: Modules
        product: CoreStorage
      - package: Modules
        product: CoreNetwork
      - package: Modules
        product: CoreNavigation
