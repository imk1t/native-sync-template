openapi: 3.1.0
info:
  title: Sample API
  version: 0.1.0
paths:
  /items:
    get:
      operationId: listItems
      summary: アイテム一覧を取得する
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
  /items/{id}:
    get:
      operationId: getItem
      summary: アイテムを 1 件取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
