# 両 OS のテストが同じ step を実装し、ViewModel の状態を比べる。
# 各テストに `@scenario items-list/<id>` を書く（tools/check-scenarios.ts が両 OS の参照を検査する）
name: items-list
feature: features/items
steps:
  - id: load-succeeds
    name: 読み込みに成功すると一覧が表示される
    given:
      listItems:
        status: 200
        body:
          - { id: "1", title: "First" }
          - { id: "2", title: "Second" }
    when: load
    then:
      state: loaded
      titles: ["First", "Second"]
  - id: load-fails
    name: 読み込みに失敗するとエラーになる
    given:
      listItems:
        status: 500
    when: load
    then:
      state: error
  - id: reappear-in-same-scope
    name: 同じ画面スコープで再表示しても取得し直さない
    given:
      listItems:
        status: 200
        body: [{ id: "1", title: "First" }]
    when: open-then-reappear-in-same-scope
    then:
      state: loaded
      titles: ["First"]
      requestCount: 1
  - id: explicit-reload
    name: 明示的な再読み込みは再取得する
    given:
      listItems:
        status: 200
        body: [{ id: "1", title: "First" }]
    when: open-then-reload
    then:
      state: loaded
      requestCount: 2
  - id: cancel-initial-load
    name: 初回読み込みのキャンセルは通信エラーにしない
    given:
      listItems:
        pending: true
    when: cancel-owning-scope
    then:
      state: loading
  - id: select-opens-detail
    name: アイテムを選ぶと詳細へ遷移する
    given:
      listItems:
        status: 200
        body: [{ id: "1", title: "First" }]
    when: select(id 1)
    then:
      navigation: push itemDetail(id 1)
  - id: transport-cancellation-retry
    name: 通信のキャンセルとキャンセル後の応答はエラーにせず再試行できる
    given:
      listItems:
        status: 200
        body: [{ id: "1", title: "First" }]
    when: cancel-first-request-at-transport-or-response-then-reappear
    then:
      stateAfterCancellation: loading
      state: loaded
      titles: ["First"]
      requestCount: 2
