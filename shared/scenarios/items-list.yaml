# 両 OS のテストが同じファイルを読み、ViewModel の状態を比べる
name: items-list
feature: features/items
steps:
  - name: 読み込みに成功すると一覧が表示される
    given:
      listItems:
        status: 200
        body:
          - { id: "1", title: "First" }
          - { id: "2", title: "Second" }
    when: load
    then:
      state: loaded
      titles: ["First", "Second"]
  - name: 読み込みに失敗するとエラーになる
    given:
      listItems:
        status: 500
    when: load
    then:
      state: error
  - name: 同じ画面スコープで再表示しても取得し直さない
    given:
      listItems:
        status: 200
        body: [{ id: "1", title: "First" }]
    when: open-then-reappear-in-same-scope
    then:
      state: loaded
      titles: ["First"]
      requestCount: 1
  - name: 明示的な再読み込みは再取得する
    given:
      listItems:
        status: 200
        body: [{ id: "1", title: "First" }]
    when: open-then-reload
    then:
      state: loaded
      requestCount: 2
  - name: 初回読み込みのキャンセルは通信エラーにしない
    given:
      listItems:
        pending: true
    when: cancel-owning-scope
    then:
      state: loading
