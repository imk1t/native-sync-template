# 両 OS のテストに同名の @scenario マーカーを記載する。
{name: github-bookmarks,feature: features/github,steps: [{id: save-restore,name: 保存・メモを復元し解除できる,given: &given {localState: {values: {}}},when: 追加・メモ保存・Store再生成・解除を行う,then: {restoredNote: メモ,finalCount: 0}},{id: limits,name: 100件と1000コードポイントを上限とする,given: *given,when: 101件目と1001文字のメモを保存する,then: {count: 100,rejectOverflow: true}},{id: write-fails,name: 書き込み失敗時は公開状態を変更しない,given: {localState: {writeFails: true}},when: 保存済みの項目を削除する,then: {retainsBookmark: true}},{id: unknown-version,name: 壊れた保存値を空データで上書きしない,given: {localState: {values: {github.bookmarks.v1: "{\"version\":2,\"items\":[]}"}}},when: 追加を試す,then: {error: true,storageUnchanged: true}},{id: concurrent-writes,name: 並行した更新を失わない,given: *given,when: 異なる2件を同時に保存する,then: {ids: [1,2]}},{id: note-save-cancel,name: 成功時は閉じキャンセル時は保存しない,given: *given,when: メモを保存し別の下書きをキャンセルする,then: {note: 保存,modalCount: 0}},{id: note-fails,name: 保存失敗時は入力とシートを保持する,given: {localState: {writeFails: true}},when: 下書きを保存する,then: {draft: 下書き,modalCount: 1,error: true}}]}
