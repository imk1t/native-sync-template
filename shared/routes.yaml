# 画面の一覧。tools/generate.py が両 OS の Route と AppTab を生成する（docs/adr/0002）。
# - name: 両 OS の型名（iOS は Route.<name>、Android は Route.<Name>）
# - feature: 画面を持つ機能モジュール。その spec.md の「画面遷移」に画面を書く
# - params: 引数。string か integer。オブジェクトは渡さず ID を渡す
# - deepLink: ディープリンクのパス。{引数名} は params と一致させる
# push かモーダルかは呼ぶ側が Navigator で決めるので、ここには書かない。
tabs:
  - id: home
    title: ホーム
    root: items
routes:
  - name: items
    feature: features/items
    deepLink: /items
  - name: itemDetail
    feature: features/items
    params:
      id: string
    deepLink: /items/{id}
